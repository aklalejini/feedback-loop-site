[project]
name = "feedback-loop-agents"
version = "0.1.0"
description = "Reviewer + manager agents for the daily feedback loop."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "playwright>=1.49.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "reviewers*", "manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
